[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "x-pump-launcher"
version = "0.1.0"
description = "Rule-bound X-to-Pump.fun launcher with a network-free preview mode"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "Pillow==12.0.0", "solders==0.27.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.3"]

[project.scripts]
xpump = "xpump.cli:main"

[tool.setuptools.package-data]
xpump = ["pump_create.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
